<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사내 의견함 정리 도우미 (HR 분류 AI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="hero">
    <p class="kicker">직원 의견 한 줄, 담당자에게 바로</p>
    <h1><span class="b">사내 의견함</span><br>정리 도우미</h1>
    <p class="notice">실제 회사 · 개인 정보는 넣지 마세요</p>
  </header>

  <main class="sheet">
    <div class="tabs" role="tablist">
      <button type="button" id="btn-classify" role="tab" aria-selected="true">분류</button>
      <button type="button" id="btn-grade" role="tab" aria-selected="false">채점</button>
    </div>
    <p id="status" class="status" role="status"></p>

    <section id="tab-classify">
      <div id="chat" class="chat" aria-live="polite">
        <div class="sys">의견 한 줄을 보내면 AI가 칸과 긴급도를 알려드려요.<br>결과는 추정이에요.</div>
      </div>
      <div id="try" class="try" aria-label="예시 문장"></div>
      <div class="composer">
        <textarea id="input" rows="1" maxlength="300" aria-label="의견 한 줄" placeholder="의견 한 줄을 적어 주세요"></textarea>
        <button type="button" id="run" class="go">보내기</button>
      </div>
    </section>

    <section id="tab-grade" hidden>
      <p class="hint">정답이 있는 문장 30개로 점수를 매겨요. 단추를 누를 때만 정답 파일을 열어요.</p>
      <div class="btns">
        <button type="button" id="btn-score" class="btn">규칙으로 채점</button>
        <button type="button" id="btn-ai" class="btn fill">AI로 채점</button>
      </div>
      <p id="ai-progress" class="progress" role="status" hidden></p>

      <div id="ai-out" hidden>
        <h2>규칙 · AI 나란히</h2>
        <table class="cmp">
          <thead><tr><th scope="col">지표</th><th scope="col">규칙</th><th scope="col">AI</th></tr></thead>
          <tbody id="cmp-body"></tbody>
        </table>
        <p id="ai-cond" class="cond"></p>
        <button type="button" id="btn-download" class="btn plain">AI 채점 결과 내려받기</button>
        <h2>AI가 틀린 문장</h2>
        <ul id="ai-wrong" class="wrong"></ul>
      </div>

      <div id="grade-result" hidden>
        <h2>규칙 채점</h2>
        <div class="card">
          <p><span class="k">칸 맞은 수</span> <strong id="g-cat"></strong></p>
          <p><span class="k">긴급도 맞은 수</span> <strong id="g-urg"></strong></p>
          <p><span class="k">둘 다 맞은 수</span> <strong id="g-both"></strong></p>
          <p><span class="k">가장 나쁜 실수</span> <strong id="g-worst"></strong></p>
          <ul id="g-worst-list" class="plain"></ul>
        </div>
        <h2>규칙이 틀린 문장</h2>
        <ul id="g-wrong" class="wrong"></ul>
      </div>
    </section>
  </main>
</div>
<script src="mask.js"></script>
<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
